[project]
name = "testmentor"
version = "0.0.1"
description = "Gereksinimden test durumuna giden yerel modelli stüdyo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "numpy>=2.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    # paket 4–7 (23 Kasım 2026): xlsx içe/dışa aktarım, Postgres, API
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

# D6 (paket 3): alternative embedding models computed on CPU in the dev container. Not part of
# the default environment (`uv sync` does not install it; `uv run --group d6 ...` does).
d6 = [
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[tool.uv]
package = false
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Archived one-off probe scripts (paket 1b stage 1), kept as evidence, not maintained code.
extend-exclude = ["eval/corpus/*/probe", ".claude"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Shell command strings for the pod start script read better unwrapped.
"scripts/infra_render.py" = ["E501"]
"eval/*.py" = ["E501"]
