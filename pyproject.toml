[project]
name = "testmentor"
version = "0.0.1"
description = "Gereksinimden test durumuna giden yerel modelli stüdyo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "numpy>=2.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Shell command strings for the pod start script read better unwrapped.
"scripts/infra_render.py" = ["E501"]
"eval/*.py" = ["E501"]
