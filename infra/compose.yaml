# ÜRETİLMİŞ DOSYA, elle düzenleme. Kaynak: config/*.yaml; yeniden üret: make compose
# Profiller: sglang | vllm (sunum motoru, embedding ile) | harici
# (model ve embedding kurumun ayrı sunucusunda; adresleri .env'de: LLM_BASE_URL,
# EMBEDDING_BASE_URL). postgres ve app her profilde çalışır (docs/pilot.md).
# Etkin model config/runtime.yaml'daki varsayılandır; başka model için make compose
# öncesi runtime.yaml'ı değiştir.
name: testmentor
services:
  sglang:
    image: lmsysorg/sglang:v0.5.23
    entrypoint:
    - /bin/sh
    - -c
    command:
    - exec python3 -m sglang.launch_server --model-path Qwen/Qwen3.8-27B-FP8 --served-model-name qwen3.8-27b --host 0.0.0.0 --port 30000 --context-length ${LLM_MAX_MODEL_LEN:-32768} --max-running-requests ${LLM_MAX_NUM_SEQS:-64} --mem-fraction-static ${LLM_GPU_MEMORY_UTILIZATION:-0.8} --enable-cache-report --grammar-backend xgrammar --api-key "$$LLM_API_KEY" --reasoning-parser qwen3
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY .env dosyasında tanımlı olmalı}
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      HF_DATASETS_OFFLINE: ${HF_DATASETS_OFFLINE:-1}
      VLLM_NO_USAGE_STATS: ${VLLM_NO_USAGE_STATS:-1}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
    volumes:
    - ${MODELS_DIR:-./models}:/models
    ports:
    - 30000:30000
    ipc: host
    deploy: &id001
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:30000/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 600s
    restart: unless-stopped
    profiles:
    - sglang
    networks:
      default:
        aliases:
        - llm
  vllm:
    image: vllm/vllm-openai:v0.34.0
    entrypoint:
    - /bin/sh
    - -c
    command:
    - exec vllm serve Qwen/Qwen3.8-27B-FP8 --served-model-name qwen3.8-27b --host 0.0.0.0 --port 8000 --max-model-len ${LLM_MAX_MODEL_LEN:-32768} --max-num-seqs ${LLM_MAX_NUM_SEQS:-64} --gpu-memory-utilization ${LLM_GPU_MEMORY_UTILIZATION:-0.8} --enable-prefix-caching --enable-prompt-tokens-details --api-key "$$LLM_API_KEY" --reasoning-parser qwen3 --language-model-only
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY .env dosyasında tanımlı olmalı}
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      HF_DATASETS_OFFLINE: ${HF_DATASETS_OFFLINE:-1}
      VLLM_NO_USAGE_STATS: ${VLLM_NO_USAGE_STATS:-1}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
    volumes:
    - ${MODELS_DIR:-./models}:/models
    ports:
    - 8000:8000
    ipc: host
    deploy: *id001
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 600s
    restart: unless-stopped
    profiles:
    - vllm
    networks:
      default:
        aliases:
        - llm
  embedding:
    image: vllm/vllm-openai:v0.34.0
    entrypoint:
    - /bin/sh
    - -c
    command:
    - exec vllm serve BAAI/bge-m3 --served-model-name bge-m3 --runner pooling --convert embed --host 0.0.0.0 --port 8001 --gpu-memory-utilization ${EMBEDDING_GPU_MEMORY_UTILIZATION:-0.08} --api-key "$$LLM_API_KEY"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY .env dosyasında tanımlı olmalı}
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      HF_DATASETS_OFFLINE: ${HF_DATASETS_OFFLINE:-1}
      VLLM_NO_USAGE_STATS: ${VLLM_NO_USAGE_STATS:-1}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
    volumes:
    - ${MODELS_DIR:-./models}:/models
    ports:
    - 8001:8001
    ipc: host
    deploy: *id001
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 600s
    restart: unless-stopped
    profiles:
    - sglang
    - vllm
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: testmentor
      POSTGRES_USER: testmentor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
    volumes:
    - pgdata:/var/lib/postgresql
    - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
    - ${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U testmentor -d testmentor
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  app:
    image: testmentor-app:local
    build:
      context: ..
      dockerfile: infra/app.Dockerfile
    environment:
      TESTMENTOR_PG_DSN: postgresql://testmentor:${POSTGRES_PASSWORD}@postgres:5432/testmentor
      TESTMENTOR_AUTH_MODE: ${TESTMENTOR_AUTH_MODE:-password}
      TESTMENTOR_AUTH_SECRET: ${TESTMENTOR_AUTH_SECRET:-}
      TESTMENTOR_USERS_FILE: /app/data/users.yaml
      TESTMENTOR_FAKE_LLM: ${TESTMENTOR_FAKE_LLM:-0}
      LLM_ENGINE: ${LLM_ENGINE:-vllm}
      LLM_MODEL: ${LLM_MODEL:-qwen3.8-27b}
      LLM_HOST: llm
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8001/v1}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY .env dosyasında tanımlı olmalı}
    volumes:
    - ${TESTMENTOR_DATA_DIR:-../data}:/app/data
    ports:
    - ${APP_PORT:-8080}:8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/auth/config', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
volumes:
  pgdata: {}
