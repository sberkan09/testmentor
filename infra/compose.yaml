# ÜRETİLMİŞ DOSYA, elle düzenleme. Kaynak: config/*.yaml; yeniden üret: make compose
# Profiller: vllm | sglang (sunum motoru). embedding ve postgres her profilde çalışır.
# Etkin model config/runtime.yaml'daki varsayılandır; başka model için make compose
# öncesi runtime.yaml'ı değiştir.
name: testmentor
services:
  sglang:
    image: lmsysorg/sglang:v0.5.23
    entrypoint:
    - /bin/sh
    - -c
    command:
    - exec python3 -m sglang.launch_server --model-path Qwen/Qwen3.8-27B-FP8 --served-model-name qwen3.8-27b --host 0.0.0.0 --port 30000 --context-length 32768 --max-running-requests 32 --mem-fraction-static 0.8 --enable-cache-report --grammar-backend xgrammar --api-key "$$LLM_API_KEY" --reasoning-parser qwen3
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY .env dosyasında tanımlı olmalı}
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
    volumes:
    - ${MODELS_DIR:-./models}:/models
    ports:
    - 30000:30000
    ipc: host
    deploy: &id001
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:30000/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 600s
    restart: unless-stopped
    profiles:
    - sglang
  vllm:
    image: vllm/vllm-openai:v0.34.0
    entrypoint:
    - /bin/sh
    - -c
    command:
    - exec vllm serve Qwen/Qwen3.8-27B-FP8 --served-model-name qwen3.8-27b --host 0.0.0.0 --port 8000 --max-model-len 32768 --max-num-seqs 32 --gpu-memory-utilization 0.8 --enable-prefix-caching --enable-prompt-tokens-details --api-key "$$LLM_API_KEY" --reasoning-parser qwen3
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY .env dosyasında tanımlı olmalı}
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
    volumes:
    - ${MODELS_DIR:-./models}:/models
    ports:
    - 8000:8000
    ipc: host
    deploy: *id001
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 600s
    restart: unless-stopped
    profiles:
    - vllm
  embedding:
    image: vllm/vllm-openai:v0.34.0
    entrypoint:
    - /bin/sh
    - -c
    command:
    - exec vllm serve BAAI/bge-m3 --served-model-name bge-m3 --runner pooling --convert embed --host 0.0.0.0 --port 8001 --gpu-memory-utilization 0.08 --api-key "$$LLM_API_KEY"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY .env dosyasında tanımlı olmalı}
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
    volumes:
    - ${MODELS_DIR:-./models}:/models
    ports:
    - 8001:8001
    ipc: host
    deploy: *id001
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 600s
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: testmentor
      POSTGRES_USER: testmentor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
    volumes:
    - pgdata:/var/lib/postgresql
    - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U testmentor -d testmentor
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  pgdata: {}
