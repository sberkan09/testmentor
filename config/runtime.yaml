# Etkin motor ve model. Motor ya da model değişimi yalnızca bu dosyada (ya da LLM_ENGINE,
# LLM_MODEL ortam değişkenlerinde) yapılır; LLMClient kullanan kod değişmez.
llm:
  engine: vllm            # çalışma varsayımı (D1)
  model: qwen3.8-27b      # çalışma varsayımı (D2)
  base_url: "http://{host}:{port}/v1"   # host: LLM_HOST (varsayılan localhost; Compose'ta llm); Runpod'da LLM_BASE_URL ya da infra/.runpod-state.json
  api_key_env: LLM_API_KEY
  request_timeout_s: 900
  connect_timeout_s: 15
  default_max_tokens: 4096
  default_temperature: null

embedding:
  base_url: "http://localhost:8001/v1"
  model: bge-m3
  model_version: BAAI/bge-m3            # embedding hash'ine girer
  batch_size: 32
  api_key_env: LLM_API_KEY
  request_timeout_s: 120
  dim: 1024                             # vektör boyutu; kb_chunks.embedding bu boyutla kurulur

kb_postgres:                # PgIndex (Postgres bilgi havuzu) anahtar kelime araması; ölçek testi eval/kb_scale.py
  keyword_max_df: 0.2       # sorguya yalnızca projenin parçalarının en çok %20'sinde geçen terimler girer
  keyword_max_terms: 32     # en nadir 32 terim; aday kümesini bunlar seçer
  keyword_candidates: 400   # BM25 bu kadar aday üzerinde hesaplanır (bellek içi BM25 ile ilk 20'de %95–96 örtüşme)

kb_upload:                  # paket 10: bilgi havuzuna belge yükleme (POST /projects/{id}/kb/documents)
  max_mb: 20
  extensions: [.txt, .md, .markdown, .pdf]   # PDF yalnızca metin katmanlıysa (taranmış PDF reddedilir)

auth:                       # paket 10 (docs/tasarim.md, API → Kurallar)
  mode: header              # header: X-User başlığı (geliştirme, testler) | password: parolalı giriş (pilot); TESTMENTOR_AUTH_MODE
  users_file: data/users.yaml   # git dışı; python -m api.users add AD; TESTMENTOR_USERS_FILE
  token_hours: 12           # jeton ömrü
  secret_env: TESTMENTOR_AUTH_SECRET   # jeton imza anahtarı .env içinde (en az 32 karakter)
  min_secret_chars: 32
  min_password_chars: 8

database:
  url_env: DATABASE_URL                 # postgresql://testmentor:...@localhost:5432/testmentor

orchestrator:               # paket 5 (docs/tasarim.md, İş kuyruğu)
  debounce_s: 1.5           # D11 çalışma varsayımı
  concurrency: 16           # sunucunun dizi sınırı 64; ölçüm koşucusuyla aynı
  p2_share: 0.7             # otomatik işlerin yuva payı (D11)
  event_buffer: 10000       # proje başına tekrar oynatılabilir olay sayısı
  lock_s: 60                # düzenleme kilidi
  undo_limit: 100           # kullanıcı başına geri alma kaydı
  store_retry_s: 2          # depo hatasından sonra işi yeniden deneme beklemesi
  store_retries: 2          # sonucu yazılamayan düğüm en çok bu kadar yeniden üretilir, sonra failed

