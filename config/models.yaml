# Aday modeller. Depo kimlikleri resmî kuruluş hesaplarından doğrulandı (19 Kasım 2026,
# Hugging Face API; kaynaklar docs/altyapi.md). Ölçüm paket 1'in işidir (D2, D4, D5).
models:
  qwen3.8-27b:
    repo_id: Qwen/Qwen3.8-27B-FP8      # Qwen'in resmî FP8 sürümü; gated değil
    served_name: qwen3.8-27b
    precision: fp8
    context_length: 32768
    max_num_seqs: 32
    approx_size_gb: 30
    engine_args:
      vllm: ["--reasoning-parser", "qwen3", "--language-model-only"]
      sglang: ["--reasoning-parser", "qwen3"]
    thinking_on: {chat_template_kwargs: {enable_thinking: true}}
    thinking_off: {chat_template_kwargs: {enable_thinking: false}}
    notes: >-
      Hibrit mimari (linear attention + görüntü kodlayıcı). Düşünme varsayılan açık.
      Hibrit mimarinin önek cache'ine etkisi belgelenmemiş; ölçülecek.

  # D4 kolları: aynı model, farklı hassasiyet. Resmî 4 bit depo yok.
  qwen3.8-27b-bf16:
    repo_id: Qwen/Qwen3.8-27B          # resmî BF16; gated değil
    served_name: qwen3.8-27b
    precision: bf16
    context_length: 32768
    max_num_seqs: 32
    approx_size_gb: 54
    gpu_memory_utilization: 0.88
    engine_args:
      vllm: ["--reasoning-parser", "qwen3", "--language-model-only"]
      sglang: ["--reasoning-parser", "qwen3"]
    thinking_on: {chat_template_kwargs: {enable_thinking: true}}
    thinking_off: {chat_template_kwargs: {enable_thinking: false}}

  qwen3.8-27b-mxfp4:
    repo_id: Qwen/Qwen3.8-27B          # BF16 ağırlıktan çalışma anında MXFP4 (W4A16, Marlin)
    served_name: qwen3.8-27b
    precision: mxfp4-online
    context_length: 32768
    max_num_seqs: 32
    approx_size_gb: 54
    engine_args:
      vllm: ["--reasoning-parser", "qwen3", "--language-model-only",
             "--quantization", "mxfp4", "--linear-backend", "marlin"]
    thinking_on: {chat_template_kwargs: {enable_thinking: true}}
    thinking_off: {chat_template_kwargs: {enable_thinking: false}}
    notes: >-
      vLLM 0.34'te bitsandbytes çekirdekten çıkarıldı; BF16'dan 4 bit için resmî yol
      --quantization mxfp4. Qwen3.8 hibrit mimaride denenmemiş (deney).

  gemma-4-31b:
    repo_id: google/gemma-4-31B-it     # Google'ın resmî FP8 sürümü yok; BF16 kullanılır
    served_name: gemma-4-31b
    precision: bf16
    context_length: 32768
    max_num_seqs: 16
    approx_size_gb: 63
    # BF16 ağırlıklar 59 GB; %80'de KV'ye 15,1 GB kalıyor, 32k'lık tek dizi 15,8 GB istiyor
    # (19 Kasım, vLLM 0.34 hata mesajı). Embedding pratikte 2,1 GB kullandığı için %88 sığar.
    gpu_memory_utilization: 0.88
    engine_args:
      vllm: ["--reasoning-parser", "gemma4", "--language-model-only"]
      sglang: []
    thinking_on: {chat_template_kwargs: {enable_thinking: true}}
    thinking_off: {chat_template_kwargs: {enable_thinking: false}}
    notes: >-
      Düşünme varsayılan kapalı. FP8 için tek seçenek üçüncü taraf deposu
      (RedHatAI/...), CLAUDE.md gereği kullanılmaz; anlık FP8 nicemleme D4'te denenebilir.

  gpt-oss-120b:
    repo_id: openai/gpt-oss-120b
    served_name: gpt-oss-120b
    precision: mxfp4
    context_length: 32768
    max_num_seqs: 16
    approx_size_gb: 65
    # Depoda aynı ağırlıkların iki kopyası daha var (original/, metal/; her biri 65 GB).
    download_ignore: ["original/*", "metal/*"]
    engine_args:
      vllm: ["--kv-cache-dtype", "fp8"]
      sglang: ["--reasoning-parser", "gpt-oss"]
    # gpt-oss düşünmeyi kapatmaz; yalnızca çabası ayarlanır.
    thinking_on: {reasoning_effort: medium}
    thinking_off: {reasoning_effort: low}
    notes: >-
      vLLM tarifi RTX 50 serisi (sm_120) desteğini "sürüyor" diye anıyor; yükleme riski var.
      --kv-cache-dtype fp8 tarifin attention-sinks önerisidir.
