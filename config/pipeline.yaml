# Pipeline çalışma varsayımları (docs/tasarim.md Deney planı, son sütun).
# Deney dosyaları (config/experiments/) yalnızca değişen tek değeri burada ezer.
prompt_version: p1
# reference: üretim altın setin öbek ve yöntemleriyle beslenir (üretim kalitesi öbekleme ve
# sınıflandırmadan ayrı ölçülür); predicted: uçtan uca (docs/tasarim.md, Deney planı kuralları).
generation_inputs: reference

methods:                    # proje kartındaki doğrulama yöntemi listesi (varsayılan)
  - name: Test
    criterion: Davranış sistem çalıştırılarak ve girdi verilerek gözlenebiliyorsa.
  - name: Analiz
    criterion: Doğrulama hesap, model, benzetim ya da istatistik gerektiriyorsa.
  - name: İnceleme
    criterion: Belge, kod, yapılandırma ya da fiziksel ürün gözle denetlenerek doğrulanıyorsa.
  - name: Gösterim
    criterion: İşlev ölçüm yapılmadan, çalıştırılıp gözlemlenerek gösteriliyorsa.
test_method: Test           # bu yöntemi taşıyan gereksinimlere test yazılır
test_types: [Normal, Sınır, Hata]
priorities: [Yüksek, Orta, Düşük]

clustering:                 # D6: BGE-M3, agglomerative (çalışma varsayımı)
  method: agglomerative
  linkage: average
  distance_threshold: 0.35  # kosinüs uzaklığı; D6 ayarlar
  max_cluster_size: 25      # D7: öbek sınırı 25

classification:             # D3: sınıflandırmada düşünme kapalı
  batch_size: 25
  thinking: false
  temperature: 0.0
  max_tokens: 4096

generation:                 # D7: öbek başına tek çağrı
  thinking: false           # D3 iki hali de ölçer
  temperature: 0.7
  max_tokens: 8192
  repair: true              # kapsanmayan gereksinimler için ek çağrı

concurrency: 16             # D5: 16–32 dizi
prefix_warmup: true         # D12: bekletmek (çalışma varsayımı)
examples_file: config/prompts/examples-generation.yaml

thresholds:                 # karar kuralı adım 1 (paket-1-olcum.md)
  schema_valid_rate: 0.99
  coverage_rate: 1.0
  step_structure_rate: 1.0
  no_test_violations: 0
